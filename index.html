<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="星骰飞宫">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>星骰飞宫计算器</title>
<style>
:root{color-scheme:light;--bg:#f6f3ee;--card:#fffdfa;--ink:#282622;--muted:#77736c;--line:#e7e1d8;--accent:#6455a5;--accent-soft:#eeeafb;--gold:#a47735}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:620px;margin:0 auto;padding:24px 0 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:700}.title{font-size:27px;font-weight:750;margin:5px 0 4px}.sub{font-size:13px;color:var(--muted);line-height:1.5}.pill{font-size:11px;border:1px solid var(--line);padding:6px 10px;border-radius:99px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:13px 0;box-shadow:0 4px 18px #352a1608}.section-title{font-size:14px;font-weight:700;margin:0 0 12px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 2px;font-size:13px;color:var(--ink);min-height:43px}.choice[aria-pressed=true]{background:var(--accent-soft);border-color:#a99bd8;color:#45377f;font-weight:700}
select{width:100%;appearance:none;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:15px;padding:13px 40px 13px 13px;background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.segment{display:grid;grid-template-columns:1fr 1fr;background:#f0ede8;padding:4px;border-radius:12px;gap:4px}.segment button{border:0;background:transparent;padding:10px 5px;border-radius:9px;font-size:13px;color:var(--muted)}.segment button.active{background:#fff;color:var(--accent);font-weight:700;box-shadow:0 1px 4px #00000010}
.result{background:#f0edf8;border-radius:16px;padding:16px;margin-top:12px}.result-label{font-size:11px;color:#746a92;margin-bottom:5px}.combo{font-size:23px;font-weight:800;letter-spacing:.01em}.rule{height:1px;background:#dcd5eb;margin:14px 0}.mapping{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}.house{background:#fff;border:1px solid #ded7ef;border-radius:99px;padding:5px 10px;font-size:12px;color:#594a91;font-weight:700}.answer{font-size:21px;font-weight:800;color:#51428a;line-height:1.45}.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}.details{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.details summary{font-size:13px;font-weight:700;cursor:pointer}.table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.table td{padding:8px;border-bottom:1px solid var(--line)}.table td:last-child{text-align:right;color:var(--accent);font-weight:650}.footer{text-align:center;color:#969087;font-size:11px;line-height:1.6;padding:14px 8px}
button{cursor:pointer;font-family:inherit}button:focus-visible,select:focus-visible{outline:3px solid #b9ace3;outline-offset:2px}
@media(min-width:520px){.choices{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<main>
  <div class="top"><div><div class="eyebrow">ASTROLOGY · HOUSE RULERS</div><div class="title">星骰飞宫</div><div class="sub">输入三颗骰子，自动反推宫位与宫主飞入关系</div></div><div class="pill">离线可用</div></div>
  <section class="card">
    <h2 class="section-title">① 行星骰</h2>
    <div class="choices" id="planetChoices"></div>
  </section>
  <section class="card">
    <h2 class="section-title">② 星座骰</h2>
    <select id="sign"></select>
    <div style="height:16px"></div>
    <h2 class="section-title">③ 宫位骰</h2>
    <div class="choices" id="houseChoices"></div>
  </section>
  <section class="card">
    <h2 class="section-title">④ 守护星体系</h2>
    <div class="segment"><button id="classical" class="active">古典守护星</button><button id="modern">现代守护星</button></div>
    <div class="result" aria-live="polite">
      <div class="result-label">星骰组合</div><div class="combo" id="combo"></div>
      <div class="rule"></div>
      <div class="result-label">该行星守护的星座及对应宫位</div><div id="destinations"></div>
      <div class="rule"></div>
      <div class="result-label">飞宫结果</div><div class="answer" id="answer"></div>
      <div class="note" id="explanation"></div>
    </div>
    <details class="details"><summary>查看十二星座完整宫位对应表</summary><table class="table" id="mappingTable"></table></details>
  </section>
  <div class="footer">计算规则：将骰出的星座视为所选宫位的宫头星座，按黄道顺序推算其余宫位；再查所选行星守护的星座，得到对应宫主飞入骰出宫位。<br>本工具用于规则推导，不包含占卜解释。</div>
</main>
<script>
const signs=["白羊座","金牛座","双子座","巨蟹座","狮子座","处女座","天秤座","天蝎座","射手座","摩羯座","水瓶座","双鱼座"];
const planets=["太阳","月亮","水星","金星","火星","木星","土星","天王星","海王星","冥王星"];
const classical={"太阳":["狮子座"],"月亮":["巨蟹座"],"水星":["双子座","处女座"],"金星":["金牛座","天秤座"],"火星":["白羊座","天蝎座"],"木星":["射手座","双鱼座"],"土星":["摩羯座","水瓶座"],"天王星":[],"海王星":[],"冥王星":[]};
const modern={"太阳":["狮子座"],"月亮":["巨蟹座"],"水星":["双子座","处女座"],"金星":["金牛座","天秤座"],"火星":["白羊座"],"木星":["射手座"],"土星":["摩羯座"],"天王星":["水瓶座"],"海王星":["双鱼座"],"冥王星":["天蝎座"]};
let state={planet:"金星",sign:"天蝎座",house:7,system:"classical"};
const $=id=>document.getElementById(id);
function makeChoices(id,items,selected,fn){$(id).innerHTML="";items.forEach((item,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=item;b.setAttribute("aria-pressed",String(item===selected));b.addEventListener("click",()=>fn(item));$(id).appendChild(b)})}
function render(){
 makeChoices("planetChoices",planets,state.planet,v=>{state.planet=v;render()});
 makeChoices("houseChoices",Array.from({length:12},(_,i)=>`${i+1}宫`),`${state.house}宫`,v=>{state.house=Number(v.replace("宫",""));render()});
 $("sign").value=state.sign;
 $("classical").classList.toggle("active",state.system==="classical");$("modern").classList.toggle("active",state.system==="modern");
 const si=signs.indexOf(state.sign);
 const houseOf=idx=>((state.house-1+(idx-si+12)%12)%12)+1;
 const mapping=signs.map((s,i)=>({sign:s,house:houseOf(i)}));
 const ruled=(state.system==="classical"?classical:modern)[state.planet];
 $("combo").textContent=`${state.planet} · ${state.sign} · ${state.house}宫`;
 $("destinations").innerHTML="";
 if(!ruled.length){$("destinations").textContent="该体系下，此行星没有守护星座。";$("answer").textContent="无法计算";$("explanation").textContent="可切换到现代守护星体系查看外行星的守护关系。"}
 else{
   const ds=ruled.map(s=>({sign:s,house:houseOf(signs.indexOf(s))}));
   ds.forEach(d=>{const row=document.createElement("div");row.className="mapping";const name=document.createElement("span");name.textContent=d.sign;const badge=document.createElement("span");badge.className="house";badge.textContent=`第${d.house}宫`;row.append(name,badge);$("destinations").appendChild(row)});
   $("answer").textContent=ds.map(d=>`${d.house}宫主`).join("、")+" 飞入第"+state.house+"宫";
   $("explanation").textContent=`${state.sign}落在第${state.house}宫；${state.planet}守护${ruled.join("、")}，对应${ds.map(d=>`第${d.house}宫`).join("和")}，因此得到以上飞宫关系。`;
 }
 $("mappingTable").innerHTML="";
 mapping.forEach(d=>{const tr=document.createElement("tr");const a=document.createElement("td"),b=document.createElement("td");a.textContent=d.sign;b.textContent=`第${d.house}宫`;tr.append(a,b);$("mappingTable").appendChild(tr)});
}
$("sign").innerHTML=signs.map(s=>`<option>${s}</option>`).join("");
$("sign").addEventListener("change",e=>{state.sign=e.target.value;render()});
$("classical").addEventListener("click",()=>{state.system="classical";render()});
$("modern").addEventListener("click",()=>{state.system="modern";render()});
render();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
